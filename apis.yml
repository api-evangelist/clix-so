- aid: clix-so:clix-mcp-server
  name: Clix MCP Server
  description: 'Model Context Protocol surfaces, both documentation-only: the provider''s stdio server @clix-so/clix-mcp-server
    0.1.4 (npx -y @clix-so/clix-mcp-server@latest; tools search_docs and search_sdk over the docs llms.txt and the
    four SDK repos; installed by `clix mcp`), and a Mintlify-served Streamable HTTP endpoint at https://docs.clix.so/mcp
    that answers initialize and tools/list anonymously (protocol 2025-06-18; search_clix_documentation, query_docs_filesystem_clix_documentation,
    submit_feedback; resource mintlify://skills/clix). Neither executes Clix operations — the docs direct agents
    to A2A for that.'
