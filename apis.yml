aid: clix-so
name: Clix
description: 'Clix is a US-based, developer-first mobile push notification platform for iOS, Android, React Native
  and Flutter — one CLI command (clix install) automates Firebase Cloud Messaging and APNs setup, and the console
  adds behaviour-triggered and API-triggered campaigns, real-time delivery logs, full-funnel analytics and device/user
  lifecycle management, priced free to 100K active devices then $30/month. For developers and agents it publishes
  a small REST API at https://api.clix.so (OpenAPI 3.1.0 generated from clix/external/v1/clix.proto: 11 operations
  across users, devices, events, messages:send, live-activities:start and campaigns/{id}:trigger, authenticated
  with X-Clix-Project-ID + X-Clix-API-Key), an A2A agent at https://api.clix.so/a2a whose card at /.well-known/agent-card.json
  is served in both 0.3.0 and 1.0 shapes and exposes four skills (create-user, track-event, send-push-notification,
  trigger-campaign) with idempotency keys, SSE streaming, task cancellation and task webhooks, a stdio MCP server
  (@clix-so/clix-mcp-server) plus a Mintlify docs MCP endpoint — both documentation-only — an open agent-skills
  repo, first-party SDKs on Maven Central, CocoaPods/SwiftPM, pub.dev and npm, a self-hosted status page with a
  published 99.5% monthly SLO, and console-configured PUSH_SENT/PUSH_FAILED webhooks.'
