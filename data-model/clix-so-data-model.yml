summary: 'Clix''s data core is small: a Project (implicit in the X-Clix-Project-ID header) owns Users, each User has many Devices, Devices and Users emit Events,
  and messages are addressed to a Target that is exactly one of project_user_id / device_id / user_id. Campaigns exist only as an id in the REST contract (they are
  authored in the console); a trigger returns a trigger_id. The spec''s 39 schemas are request/response wrappers around eight entities; the $ref graph below is computed
  from the spec and the relationships are read from the id-reference fields (user_id on Device and Event, device_id on Event and DeliveryResult) plus the docs'' user
  model.'
entities:
- name: Project
  schema: null
  identity: X-Clix-Project-ID header
  note: Never a body field; tenancy is the header. Rate limits and API keys are per project.
- name: User
  schema: v1User
  fields:
  - id
  - project_user_id
  - properties
  identity: id (Clix uuid) and project_user_id (customer id, unique per project)
  docs_note: Identified users have a project_user_id; anonymous users have only an anonymous_id (docs); on sign-in the anonymous history is merged into the identified
    user.
- name: UserProperty
  schema: clixexternalv1UserProperty
  fields:
  - name
  - type (USER_PROPERTY_TYPE_STRING|NUMBER|BOOLEAN)
  - value
- name: Device
  schema: clixexternalv1Device
  fields:
  - id
  - user_id
  - model
  - manufacturer
  - platform
  - os_name
  - os_version
  - app_name
  - app_version
  - sdk_type
  - sdk_version
  - ad_id
  - locale_region
  - locale_language
  - timezone
  - is_push_permission_granted
  - push_token
  - push_token_type
  identity: id (uuid)
- name: Event
  schema: v1Event
  fields:
  - user_id
  - device_id
  - name
  - event_property {message_id, custom_properties}
  note: event_property.message_id links an event (e.g. PUSH_NOTIFICATION_TAPPED) back to the message that caused it.
- name: PushNotification
  schema: clixexternalv1PushNotification
  fields:
  - target
  - title
  - body
  - image_url
  - landing_url
  note: A send request item; the persisted counterpart is identified by DeliveryResult.message_id.
- name: Target
  schema: clixexternalv1PushNotificationTarget / clixexternalv1LiveActivityTarget
  fields:
  - oneOf project_user_id | device_id | user_id
- name: DeliveryResult
  schema: clixexternalv1DeliveryResult
  fields:
  - message_id
  - status (DELIVERY_RESULT_STATUS_SUCCEED|FAILED)
  - additional_params {device_id, fcm_message_id, failure_reason}
- name: LiveActivity
  schema: clixexternalv1LiveActivity
  fields:
  - target
  - attributes_type
  - attributes
  - content_state
  - alert {title, body}
- name: Campaign
  schema: null
  identity: campaign_id path parameter
  note: Authored in the console (scheduled, event-triggered or API-triggered); the API only triggers it. v1TriggerCampaignRequest {audience {broadcast, targets[]},
    properties} -> v1TriggerCampaignResponse {trigger_id}.
- name: CampaignTrigger
  schema: v1TriggerCampaignResponse
  fields:
  - trigger_id
  note: Tracks one trigger call; delivery is asynchronous.
relationships:
- from: Project
  to: User
  type: has_many
  via: X-Clix-Project-ID header scopes project_user_id
- from: User
  to: Device
  type: has_many
  via: Device.user_id
- from: Device
  to: User
  type: belongs_to
  via: user_id; set with SetProjectUserIdForDevice
- from: User
  to: UserProperty
  type: has_many
  via: User.properties / CreateOrUpdateUsersPropertiesByDeviceId
- from: Device
