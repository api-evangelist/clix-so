summary: >-
  Clix's agent surfaces are asymmetric. Its MCP tools (both the provider's stdio server and the Mintlify docs
  endpoint) are documentation retrieval and bind to NO REST operation, so every MCP tool is mcp_only. Its
  A2A skills are the execution surface, and each of the four binds cleanly to one REST operation — the docs
  describe the same semantics, parameters and result fields (the A2A artifact `delivery-results` carries
  the REST response's delivery_results shape, `trigger-result.triggerId` is the REST trigger_id, and
  `user-result` returns the REST user identity). Seven REST operations — device registration, device-scoped
  user identity and properties, health, live activities, user update and user delete — have no agent skill
  and no tool. Confidence is medium rather than high on the skill rows because the A2A docs and the REST
  spec were mapped by documented semantics; the live A2A endpoint is key-gated (POST /a2a without a key
  returns 401 "Missing API key") and no task was executed.
