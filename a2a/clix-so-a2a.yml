agent_card:
  name: Clix Agent
  description: AI Agent for Clix - Send push notifications, manage campaigns, and track user events
  url: https://api.clix.so/a2a
  version: 1.0.0
  protocol_version: '0.3.0'
  preferred_transport: JSONRPC
  additional_interfaces: [{url: 'https://api.clix.so/a2a', transport: JSONRPC}]
  provider: {organization: Clix, url: 'https://api.clix.so'}
  capabilities: {streaming: true, push_notifications: true, state_transition_history: true}
  security_schemes:
    apiKey: {type: apiKey, in: header, name: X-API-Key, description: Secret API key for A2A authentication}
  security: [{apiKey: []}]
  supports_authenticated_extended_card: true
  default_input_modes: [text/plain, application/json]
  default_output_modes: [text/plain, application/json]
  documentation_url: null
  icon_url: null
  skill_count: 4
  skills:
  - {id: send-push-notification, name: Send Push Notification, tags: [push, notification, messaging], examples: 2}
  - {id: trigger-campaign, name: Trigger Campaign, tags: [campaign, marketing, automation], examples: 2}
  - {id: create-user, name: Create or Update User, tags: [user, crm, profile], examples: 1}
  - {id: track-event, name: Track User Event, tags: [event, analytics, tracking], examples: 1}
  skill_invocation: >-
    SendMessage (v1) / message/send (v0) with a data part {"skill": "<id>", ...params}. Payload shapes per
    skill are documented at https://docs.clix.so/a2a/skills; each skill writes one named artifact
    (user-result, event-result, delivery-results, trigger-result). REST bindings in mcp/clix-so-tool-crosswalk.yml.
protocol_surface:
  base_url: https://api.clix.so
  endpoint: POST /a2a (JSON-RPC 2.0 over HTTPS; SSE for streaming methods)
  version_header: 'A2A-Version: 1.0 selects V1 method names and shapes; omitted = V0 (0.3) legacy mode'
  auth: 'X-API-Key: clix_sk_... (secret key only; public keys rejected; project resolved from the key, no project header)'
  idempotency: 'X-Clix-Idempotency-Key on SendMessage, falling back to message.messageId; replay returns the cached response, in-flight or body-mismatch reuse returns HTTP 409 with JSON-RPC -32603'
  tracing: X-Request-ID on every response
  methods_v1: [SendMessage, SendStreamingMessage, GetTask, ListTasks, CancelTask, SubscribeToTask, CreateTaskPushNotificationConfig, GetTaskPushNotificationConfig, ListTaskPushNotificationConfigs, DeleteTaskPushNotificationConfig, GetExtendedAgentCard]
  methods_v0: [message/send, message/stream, tasks/get, tasks/list, tasks/cancel, tasks/resubscribe, tasks/pushNotificationConfig/set, tasks/pushNotificationConfig/get, tasks/pushNotificationConfig/list, tasks/pushNotificationConfig/delete, agent/getAuthenticatedExtendedCard]
  task_states: [submitted, working, completed, failed, canceled, rejected, input-required, auth-required]
  error_codes: 'JSON-RPC -32700..-32603 plus A2A -32001 TaskNotFound, -32002 TaskNotCancelable, -32003 PushNotificationNotSupported, -32004 UnsupportedOperation, -32005 ContentTypeNotSupported, -32006 InvalidAgentResponse, -32007 SkillNotFound'
  task_webhooks: 'CreateTaskPushNotificationConfig registers an HTTPS callback; Clix POSTs a JSON-RPC request with method tasks/pushNotification, sends Authorization: <scheme> <credentials> and X-A2A-Token: <token> when configured, and rejects loopback/link-local/site-local destinations'
  docs:
  - https://docs.clix.so/a2a/overview
  - https://docs.clix.so/a2a/quickstart
  - https://docs.clix.so/a2a/api-reference
  - https://docs.clix.so/a2a/advanced-features
  - https://docs.clix.so/a2a/skills
  - https://docs.clix.so/a2a/version-compatibility
conformance:
  spec: A2A 1.0.0
  grade: conformant
  protocol_version: '0.3.0'
  preferred_transport: JSONRPC
  hard_checks:
    capabilities_is_object: true
    protocol_version_present: true
    skills_is_array: true
  optional_fields:
    default_input_modes: true
    default_output_modes: true
    preferred_transport: true
  grade_basis: >-
    Graded on the default (unheadered) body, which is what a client that has not yet negotiated a version
    receives. capabilities is an OBJECT (streaming, pushNotifications, stateTransitionHistory — all true);
    protocolVersion is present at the top level ("0.3.0"); skills is an ARRAY of four fully populated skills
    (id, name, description, tags, examples). All three optional discriminators are present. The card also
    declares securitySchemes + security, provider, additionalInterfaces and supportsAuthenticatedExtendedCard.
    The v1 body served under A2A-Version: 1.0 is a correctly shaped 1.0 card (supportedInterfaces[] with
    protocolBinding JSONRPC and protocolVersion "1.0"; securityRequirements; capabilities.extendedAgentCard) —
    it has no TOP-LEVEL protocolVersion because 1.0 moves that field per interface, which is by design and not
    a deviation. Clix is one of the few providers serving both shapes from one path.
  deviations:
  - field: skills[].inputModes / outputModes / security
    observed: present but EMPTY arrays on every skill
    note: Optional per-skill fields; empty arrays fall back to the card defaults (text/plain, application/json). Harmless, but a reader checking `inputModes.length` sees zero.
  - field: documentationUrl
    observed: absent in the 0.3.0 body; explicitly null in the 1.0 body
    note: The A2A docs live at https://docs.clix.so/a2a/overview and are not linked from the card.
  - field: iconUrl / signatures
    observed: absent
    note: No JWS signature block; authenticity rests on TLS to api.clix.so.
  - field: v1 supportedInterfaces[0].tenant
    observed: '"" (empty string)'
    note: A serialised-empty field from the protobuf-generated card; not a fault.
  - field: v1 securitySchemes.apiKey
    observed: 'the oneof is serialised with every alternative present and null (httpAuthSecurityScheme, oauth2SecurityScheme, openIdConnectSecurityScheme, mtlsSecurityScheme all null) alongside apiKeySecurityScheme'
    note: Valid JSON and unambiguous, but strict readers that reject null members will need to tolerate it.
  - field: provider.url
    observed: https://api.clix.so
    note: Points at the API host rather than the company site https://clix.so. Same organisation; recorded for readers that dereference provider.url as a homepage.
surface_relationship:
  note: >-
    Clix separates its agent protocols by job: MCP (a stdio docs server and a Mintlify docs endpoint) gives an
    assistant context; A2A executes work. The four A2A skills are projections of four of the eleven REST
    operations at https://api.clix.so (users, events, messages:send, campaigns:trigger) — see
    mcp/clix-so-tool-crosswalk.yml. The A2A layer adds what REST lacks: idempotency keys, task state, SSE
    streaming, cancellation and task webhooks.
