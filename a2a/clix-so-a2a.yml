discovery:
  path: /.well-known/agent-card.json
  canonical: true
  host: api.clix.so
  note: >-
    Served from the API host, which is also the OpenAPI servers[] host and the A2A JSON-RPC host. The apex
    clix.so and www.clix.so do not serve a card (404). The legacy /.well-known/agent.json returns 404 on
    api.clix.so, and the negative-control path also 404s, so the 200 is a served document, not a catch-all.
    The card is version-negotiated by request header: without A2A-Version it returns the 0.3.0 shape (url +
    preferredTransport + top-level protocolVersion "0.3.0"); with A2A-Version: 1.0 it returns the 1.0 shape
    (supportedInterfaces[] with per-interface protocolVersion "1.0", securityRequirements,
    capabilities.extendedAgentCard). Both bodies were saved. Ownership is not in question — provider.organization
    "Clix", provider.url https://api.clix.so, the docs at docs.clix.so/a2a/* describe exactly this card and
    endpoint, and the skills are the four Clix operations. A second card on docs.clix.so (see below) is a
    Mintlify platform artifact, not the provider's agent.
