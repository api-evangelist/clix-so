  curl installer) and a stdio MCP server (npm). Every SDK repo carries a Keep-a-Changelog CHANGELOG.md and
  an llms.txt. Releases are recent: the newest is the CLI (2026-07-04) and the oldest still-current SDK
  release is Flutter 0.1.0 (2026-02-19). None predates the API surface it wraps. The docs badge for an
  npm package @clix-so/clix-agent-skills points at a package the registry does not hold; the skills are
  distributed from the GitHub repo instead (see skills/_index.yml).
