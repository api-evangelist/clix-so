crosswalk:
- tool: create-user
  surface: a2a
  category: users
  rest: [ClixExternalService_CreateUser]
  binding: 'A2A data part {skill: create-user, projectUserId, properties?} -> POST /api/v1/users {project_user_id, properties}. The REST operation upserts ("If a user with the same project_user_id already exists, this endpoint will update the existing user''s properties"), which is why the skill is named "Create or Update User".'
  artifact: user-result {userId, projectUserId}
  confidence: medium
  note: ClixExternalService_UpdateUser (PATCH) is a narrower alternative binding for the update half; the skill docs describe one create-or-update call, so CreateUser is the primary.
- tool: track-event
  surface: a2a
  category: events
  rest: [ClixExternalService_CreateEvents]
  binding: 'A2A {skill: track-event, eventName, deviceId, properties?} -> POST /api/v1/events {events: [{device_id, name, event_property: {custom_properties}}]}. The skill tracks one event for one device; the REST body is a list.'
  artifact: event-result {trackedEvents, eventName}
  confidence: medium
- tool: send-push-notification
  surface: a2a
  category: messaging
  rest: [ClixExternalService_SendPushNotifications]
  binding: 'A2A {skill: send-push-notification, deviceId|userId|projectUserId, title?, body?, imageUrl?, landingUrl?} -> POST /api/v1/messages:send {push_notifications: [{target, title, body, image_url, landing_url}]}. Field names are the camelCase twins of the REST snake_case fields; one target per skill call, up to a recommended 500 per REST call.'
  artifact: 'delivery-results {totalSent, results[]{messageId, status}} — status values are the REST DeliveryResultStatus enum strings (DELIVERY_RESULT_STATUS_SUCCEED / _FAILED)'
  confidence: medium
- tool: trigger-campaign
  surface: a2a
  category: campaigns
  rest: [ClixExternalService_TriggerCampaign]
  binding: 'A2A {skill: trigger-campaign, campaignId, targets?, properties?} -> POST /api/v1/campaigns/{campaign_id}:trigger {audience: {broadcast?, targets?}, properties?}. Omitting targets in A2A "creates the trigger without an explicit target list", the REST equivalent of triggering with the campaign''s default audience.'
  artifact: trigger-result {triggerId}
  confidence: medium
