  version: 'V1 (A2A-Version: 1.0)'
  date: null
  breaking:
  - PascalCase method names replace slash-style V0 names (SendMessage for message/send, etc.)
  - kind discriminator removed from parts, messages, tasks and stream events
  - SendMessage result moves to result.task
  - ListTasks pagination changes from limit/offset to pageSize/pageToken with a paged response object
  - Push-notification-config params renamed to taskId / id
