apis:
- aid: clix-so:clix-external-api
  name: Clix External API
  description: 'Server-to-server REST API for Clix mobile push: create/update/delete project users and their properties,
    register devices and bind them to users, ingest events, send ad-hoc push notifications to one or more targets
    (project_user_id | device_id | user_id), start iOS Live Activities, and trigger API-triggered campaigns with
    dynamic properties. 11 operations under https://api.clix.so/api/v1, published as OpenAPI 3.1.0 (grpc-gateway
    output of clix/external/v1/clix.proto) at https://docs.clix.so/api-reference/openapi.json. Two API-key headers
    on every call; 1,000 requests/second/project token bucket with X-RateLimit-* and Retry-After headers; JSON only;
    no idempotency key on REST writes.'
  humanURL: https://docs.clix.so/api-reference/overview
  baseURL: https://api.clix.so
