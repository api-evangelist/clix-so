  type: has_many
  via: Event.device_id
- from: User
  to: Event
  type: has_many
  via: Event.user_id
- from: Event
  to: PushNotification
  type: belongs_to
  via: event_property.message_id (optional)
- from: PushNotification
  to: Target
  type: has_one
  via: target (oneOf)
- from: Target
  to: User
  type: belongs_to
  via: project_user_id or user_id
- from: Target
  to: Device
  type: belongs_to
  via: device_id
- from: PushNotification
  to: DeliveryResult
  type: has_many
  via: DeliveryResult.message_id + additional_params.device_id (one per resolved device)
- from: LiveActivity
  to: Target
  type: has_one
  via: target (oneOf)
- from: LiveActivity
  to: DeliveryResult
  type: has_many
  via: StartLiveActivitiesResponse.delivery_results
- from: Campaign
  to: CampaignTrigger
  type: has_many
  via: TriggerCampaign -> trigger_id
- from: CampaignTrigger
  to: Target
  type: has_many
  via: audience.targets[] (project_user_id | device_id)
id_conventions:
  user.id / device.id / message_id / trigger_id: uuid strings (examples 5dbdd10e-6ea6-4ff7-836d-bd30a6d1a521)
  project_user_id: customer-defined string, unique per project, reusable after delete
  anonymous_id: assigned by Clix to every user (docs), not exposed in the REST schemas
