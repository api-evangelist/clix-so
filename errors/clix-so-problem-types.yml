  remediation: 'Check request parameters, headers, and body format. Refer to endpoint documentation. (overview) Do not retry a 4xx unchanged — the docs'' retry helper stops on status < 500.'
- status: 401
  title: Unauthorized — missing or invalid X-Clix-Project-ID / X-Clix-API-Key (REST) or X-API-Key (A2A)
  occurrences: 11
  source_operations: [all operations (global security requirement); documented per endpoint as "Authentication failed or invalid API key"]
  observed: ['Missing API key (a2a)', 'Missing project id (REST)']
  remediation: 'Verify API key and Project ID are correct and valid. Use a SECRET key for server-side operations (user management, message sending, campaign triggering) and for /a2a, which rejects public keys.'
- status: 404
  title: Not Found — resource does not exist
  occurrences: 1
  source_operations: [ClixExternalService_UpdateUser]
  note: 'Update returns an EMPTY body with 404 when the project_user_id is unknown. Delete deliberately does NOT 404 — "it returns 200 OK even if the user doesn''t exist".'
  remediation: The resource (user, campaign, etc.) doesn't exist. Verify the resource ID.
- status: 409
  title: Conflict — idempotency key in progress or reused with a different body (A2A SendMessage only)
  occurrences: 1
  source_operations: [A2A SendMessage]
  body: JSON-RPC error with code -32603
  remediation: Wait for the original request to finish, or use a fresh X-Clix-Idempotency-Key when the body has genuinely changed.
- status: 429
  title: Too Many Requests — token bucket exhausted (1,000 requests / second / project)
  occurrences: 11
  body: '{"error": "Too Many Requests"}'
  headers: [X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset, 'Retry-After: 1']
  remediation: Back off until X-RateLimit-Reset / Retry-After; see rate-limits/clix-so-rate-limits.yml.
- status: 500
  title: Internal Server Error
  remediation: Temporary server issue. Implement exponential backoff and retry (1s, 2s, 4s).
- status: 503
  title: Service Unavailable
  remediation: Scheduled maintenance or temporary outage. Retry after a delay; check https://clix.so/status.
- status: timeout
  title: Request terminated after 100 seconds
  remediation: 'API requests have a maximum execution time of 100 seconds ... Ensure your integration handles timeouts gracefully.'
